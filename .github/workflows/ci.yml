name: Backend CI

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, test and package
        run: mvn -B -ntp verify

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: truck-life-simulator-api
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build OCI image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag truck-life-simulator-api:${{ github.sha }} .
