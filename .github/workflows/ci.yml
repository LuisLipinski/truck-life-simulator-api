name: Backend CI

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, package and quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify with Maven Wrapper
        run: ./mvnw -B -ntp verify

      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f target/site/jacoco/jacoco.csv ]; then
            echo "JaCoCo report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(Path('target/site/jacoco/jacoco.csv').open()))
          line_missed = sum(int(row['LINE_MISSED']) for row in rows)
          line_covered = sum(int(row['LINE_COVERED']) for row in rows)
          branch_missed = sum(int(row['BRANCH_MISSED']) for row in rows)
          branch_covered = sum(int(row['BRANCH_COVERED']) for row in rows)

          def percentage(covered, missed):
              total = covered + missed
              return 100.0 if total == 0 else covered * 100.0 / total

          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## JaCoCo coverage\n\n')
              summary.write('| Metric | Coverage | Gate |\n')
              summary.write('| --- | ---: | ---: |\n')
              summary.write(f"| Lines | {percentage(line_covered, line_missed):.2f}% | 85% |\n")
              summary.write(f"| Branches | {percentage(branch_covered, branch_missed):.2f}% | 60% |\n")
          PY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  container:
    name: Build OCI image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build OCI image
        run: ./mvnw -B -ntp -DskipTests spring-boot:build-image

  post-deploy:
    name: Verify Render revision and database schema
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest
    needs: container
    timeout-minutes: 12

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7

      - name: Determine expected Flyway version
        id: flyway
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          versions = []
          pattern = re.compile(r"^V([0-9]+(?:[._][0-9]+)*)__")
          migration_dir = Path("src/main/resources/db/migration")
          for path in migration_dir.glob("V*__*.sql"):
              match = pattern.match(path.name)
              if not match:
                  continue
              raw = match.group(1)
              normalized = raw.replace("_", ".")
              key = tuple(int(part) for part in normalized.split("."))
              versions.append((key, normalized))

          if not versions:
              raise SystemExit("No versioned Flyway migrations were found")

          expected = max(versions, key=lambda item: item[0])[1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={expected}\n")
          print(f"Expected Flyway version: {expected}")
          PY

      - name: Verify deployed Render revision and database schema
        env:
          BASE_URL: https://truck-life-simulator-api.onrender.com
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: development
          EXPECTED_FLYWAY_VERSION: ${{ steps.flyway.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          base_url = os.environ["BASE_URL"].rstrip("/")
          expected_sha = os.environ["EXPECTED_SHA"]
          expected_branch = os.environ["EXPECTED_BRANCH"]
          expected_flyway = os.environ["EXPECTED_FLYWAY_VERSION"]
          progression_path = "/api/v1/careers/{careerId}/progression"

          def get_json(path, attempt):
              separator = "&" if "?" in path else "?"
              cache_buster = urllib.parse.urlencode(
                  {
                      "deployCheck": expected_sha,
                      "attempt": attempt,
                      "nonce": time.time_ns(),
                  }
              )
              request = urllib.request.Request(
                  f"{base_url}{path}{separator}{cache_buster}",
                  headers={
                      "User-Agent": "truck-life-simulator-post-deploy-check",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.load(response)

          last_reasons = []
          for attempt in range(1, 41):
              try:
                  readiness = get_json("/actuator/health/readiness", attempt)
                  info = get_json("/actuator/info", attempt)
                  openapi = get_json("/v3/api-docs", attempt)

                  reasons = []
                  if readiness.get("status") != "UP":
                      reasons.append(f"readiness={readiness.get('status')!r}")

                  app = info.get("app") or {}
                  if app.get("commit") != expected_sha:
                      reasons.append(f"commit={app.get('commit')!r}")
                  if app.get("branch") != expected_branch:
                      reasons.append(f"branch={app.get('branch')!r}")

                  schema = info.get("databaseSchema") or {}
                  if str(schema.get("currentVersion")) != expected_flyway:
                      reasons.append(f"flyway={schema.get('currentVersion')!r}")
                  if schema.get("pendingMigrations") != 0:
                      reasons.append(f"pendingMigrations={schema.get('pendingMigrations')!r}")

                  paths = openapi.get("paths") or {}
                  if progression_path not in paths:
                      reasons.append("progression OpenAPI path is missing")

                  if not reasons:
                      summary = (
                          "## Post-deploy verification\n\n"
                          "- Render readiness: UP\n"
                          f"- Deployed commit: `{expected_sha}`\n"
                          f"- Deployed branch: `{expected_branch}`\n"
                          f"- Flyway version: `{expected_flyway}`\n"
                          "- Pending migrations: `0`\n"
                          "- Progression OpenAPI contract: present\n"
                      )
                      with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                          output.write(summary)
                      print("Post-deploy verification passed")
                      raise SystemExit(0)

                  last_reasons = reasons
                  print(f"Attempt {attempt}: deployment not ready yet: {', '.join(reasons)}")
              except Exception as exception:
                  last_reasons = [f"request failed: {exception}"]
                  print(f"Attempt {attempt}: {last_reasons[0]}")

              if attempt < 40:
                  time.sleep(15)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Post-deploy verification failed\n\n")
              output.write(f"Expected commit: `{expected_sha}`\n\n")
              output.write(f"Expected Flyway version: `{expected_flyway}`\n\n")
              output.write("Last observations:\n")
              for reason in last_reasons:
                  output.write(f"- {reason}\n")
          raise SystemExit("Render did not reach the expected deployed state")
          PY
