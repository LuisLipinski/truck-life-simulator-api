name: Backend CI

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, package and quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify with Maven Wrapper
        run: ./mvnw -B -ntp verify

      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f target/site/jacoco/jacoco.csv ]; then
            echo "JaCoCo report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(Path('target/site/jacoco/jacoco.csv').open()))
          line_missed = sum(int(row['LINE_MISSED']) for row in rows)
          line_covered = sum(int(row['LINE_COVERED']) for row in rows)
          branch_missed = sum(int(row['BRANCH_MISSED']) for row in rows)
          branch_covered = sum(int(row['BRANCH_COVERED']) for row in rows)

          def percentage(covered, missed):
              total = covered + missed
              return 100.0 if total == 0 else covered * 100.0 / total

          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## JaCoCo coverage\n\n')
              summary.write('| Metric | Coverage | Gate |\n')
              summary.write('| --- | ---: | ---: |\n')
              summary.write(f"| Lines | {percentage(line_covered, line_missed):.2f}% | 85% |\n")
              summary.write(f"| Branches | {percentage(branch_covered, branch_missed):.2f}% | 60% |\n")
          PY

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  container:
    name: Build OCI image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build OCI image
        run: ./mvnw -B -ntp -DskipTests spring-boot:build-image
