name: Backend CI

on:
  pull_request:
    branches:
      - development
      - master
  push:
    branches:
      - development
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile, test and package
        run: sh ./mvnw -B -ntp verify

      - name: Publish coverage summary
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.csv")
          rows = list(csv.DictReader(report.open(encoding="utf-8")))
          counters = [
              ("Instructions", "INSTRUCTION_MISSED", "INSTRUCTION_COVERED"),
              ("Branches", "BRANCH_MISSED", "BRANCH_COVERED"),
              ("Lines", "LINE_MISSED", "LINE_COVERED"),
              ("Methods", "METHOD_MISSED", "METHOD_COVERED"),
              ("Complexity", "COMPLEXITY_MISSED", "COMPLEXITY_COVERED"),
          ]

          lines = ["## JaCoCo coverage", "", "| Metric | Covered | Missed | Coverage |", "| --- | ---: | ---: | ---: |"]
          for label, missed_key, covered_key in counters:
              missed = sum(int(row[missed_key]) for row in rows)
              covered = sum(int(row[covered_key]) for row in rows)
              total = missed + covered
              percentage = (covered / total * 100) if total else 100.0
              lines.append(f"| {label} | {covered} | {missed} | {percentage:.2f}% |")
              print(f"{label}: {percentage:.2f}% ({covered}/{total})")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: truck-life-simulator-api
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build OCI image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build application image
        run: docker build --tag truck-life-simulator-api:${{ github.sha }} .
