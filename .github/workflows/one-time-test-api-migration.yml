name: One-time deprecated test API migration

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'chore/backend-hardening-next'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: chore/backend-hardening-next
          fetch-depth: 0

      - name: Migrate deprecated Java test APIs
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            sed -i 's/import org\.testcontainers\.containers\.PostgreSQLContainer;/import org.testcontainers.postgresql.PostgreSQLContainer;/' "$file"
          done < <(grep -RIl 'import org\.testcontainers\.containers\.PostgreSQLContainer;' src/test/java || true)

          sed -i 's/\.asText()/\.asString()/g' \
            src/test/java/com/luislipinski/trucklife/identity/config/RefreshCookieOriginFilterTest.java

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'test: migrate deprecated test APIs'
          git push origin HEAD:chore/backend-hardening-next
