name: One-time Testcontainers v2 syntax fix

on:
  pull_request:
    branches:
      - development

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'chore/backend-hardening-next'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: chore/backend-hardening-next
          fetch-depth: 0

      - name: Remove obsolete PostgreSQLContainer generics
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            sed -i 's/PostgreSQLContainer<?>/PostgreSQLContainer/g' "$file"
            sed -i 's/new PostgreSQLContainer<>(/new PostgreSQLContainer(/g' "$file"
          done < <(grep -RIl 'org.testcontainers.postgresql.PostgreSQLContainer' src/test/java || true)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'test: adapt PostgreSQLContainer to Testcontainers 2'
          git push origin HEAD:chore/backend-hardening-next
