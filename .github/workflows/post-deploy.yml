name: Post-deploy verification

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: post-deploy-development
  cancel-in-progress: true

jobs:
  verify-render:
    name: Verify Render revision and database schema
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine expected Flyway version
        id: flyway
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          versions = []
          pattern = re.compile(r"^V([0-9]+(?:[._][0-9]+)*)__")
          migration_dir = Path("src/main/resources/db/migration")
          for path in migration_dir.glob("V*__*.sql"):
              match = pattern.match(path.name)
              if not match:
                  continue
              raw = match.group(1)
              normalized = raw.replace("_", ".")
              key = tuple(int(part) for part in normalized.split("."))
              versions.append((key, normalized))

          if not versions:
              raise SystemExit("No versioned Flyway migrations were found")

          expected = max(versions, key=lambda item: item[0])[1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={expected}\n")
          print(f"Expected Flyway version: {expected}")
          PY

      - name: Verify deployed Render revision and database schema
        env:
          BASE_URL: https://truck-life-simulator-api.onrender.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: development
          EXPECTED_FLYWAY_VERSION: ${{ steps.flyway.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base_url = os.environ["BASE_URL"].rstrip("/")
          expected_sha = os.environ["EXPECTED_SHA"]
          expected_branch = os.environ["EXPECTED_BRANCH"]
          expected_flyway = os.environ["EXPECTED_FLYWAY_VERSION"]
          progression_path = "/api/v1/careers/{careerId}/progression"

          def get_json(path):
              request = urllib.request.Request(
                  base_url + path,
                  headers={"User-Agent": "truck-life-simulator-post-deploy-check"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.load(response)

          last_reasons = []
          for attempt in range(1, 41):
              try:
                  readiness = get_json("/actuator/health/readiness")
                  info = get_json("/actuator/info")
                  openapi = get_json("/v3/api-docs")

                  reasons = []
                  if readiness.get("status") != "UP":
                      reasons.append(f"readiness={readiness.get('status')!r}")

                  app = info.get("app") or {}
                  if app.get("commit") != expected_sha:
                      reasons.append(f"commit={app.get('commit')!r}")
                  if app.get("branch") != expected_branch:
                      reasons.append(f"branch={app.get('branch')!r}")

                  schema = info.get("databaseSchema") or {}
                  if str(schema.get("currentVersion")) != expected_flyway:
                      reasons.append(f"flyway={schema.get('currentVersion')!r}")
                  if schema.get("pendingMigrations") != 0:
                      reasons.append(f"pendingMigrations={schema.get('pendingMigrations')!r}")

                  paths = openapi.get("paths") or {}
                  if progression_path not in paths:
                      reasons.append("progression OpenAPI path is missing")

                  if not reasons:
                      summary = (
                          "## Post-deploy verification\n\n"
                          f"- Render readiness: UP\n"
                          f"- Deployed commit: `{expected_sha}`\n"
                          f"- Deployed branch: `{expected_branch}`\n"
                          f"- Flyway version: `{expected_flyway}`\n"
                          "- Pending migrations: `0`\n"
                          "- Progression OpenAPI contract: present\n"
                      )
                      with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                          output.write(summary)
                      print("Post-deploy verification passed")
                      raise SystemExit(0)

                  last_reasons = reasons
                  print(f"Attempt {attempt}: deployment not ready yet: {', '.join(reasons)}")
              except Exception as exception:
                  last_reasons = [f"request failed: {exception}"]
                  print(f"Attempt {attempt}: {last_reasons[0]}")

              if attempt < 40:
                  time.sleep(15)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Post-deploy verification failed\n\n")
              output.write(f"Expected commit: `{expected_sha}`\n\n")
              output.write(f"Expected Flyway version: `{expected_flyway}`\n\n")
              output.write("Last observations:\n")
              for reason in last_reasons:
                  output.write(f"- {reason}\n")
          raise SystemExit("Render did not reach the expected deployed state")
          PY
