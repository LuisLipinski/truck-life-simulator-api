services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: truck_life
      POSTGRES_USER: truck_life
      POSTGRES_PASSWORD: truck_life
    ports:
      - "5432:5432"
    volumes:
      - truck-life-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truck_life -d truck_life"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  truck-life-postgres:
