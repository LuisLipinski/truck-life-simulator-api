spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

logging:
  pattern:
    level: '%5p [correlationId=%X{correlationId:-}]'

identity:
  session:
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64}
    issuer: ${AUTH_JWT_ISSUER}
    audience: ${AUTH_JWT_AUDIENCE}
  web:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}
