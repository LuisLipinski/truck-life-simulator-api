spring:
  application:
    name: truck-life-simulator-api
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

identity:
  email-verification-ttl: ${AUTH_EMAIL_VERIFICATION_TTL:PT24H}
  rate-limit:
    registration:
      max-attempts: ${AUTH_REGISTER_RATE_LIMIT_ATTEMPTS:5}
      window: ${AUTH_REGISTER_RATE_LIMIT_WINDOW:PT1H}
    email-verification:
      max-attempts: ${AUTH_VERIFY_EMAIL_RATE_LIMIT_ATTEMPTS:10}
      window: ${AUTH_VERIFY_EMAIL_RATE_LIMIT_WINDOW:PT30M}
    resend-verification:
      max-attempts: ${AUTH_RESEND_VERIFICATION_RATE_LIMIT_ATTEMPTS:3}
      window: ${AUTH_RESEND_VERIFICATION_RATE_LIMIT_WINDOW:PT1H}

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
    description: '@project.description@'
